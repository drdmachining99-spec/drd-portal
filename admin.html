<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRD Admin</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wide"><h1>DRD Admin Dashboard</h1><p class="muted">New requests and quotation review</p><table><tr><th>Job ID</th><th>Company</th><th>Part</th><th>Qty</th><th>Type</th><th>Status</th><th>Time</th></tr>{% for j in jobs %}<tr><td><a href="/admin/job/{{j['id']}}">{{j['job_id']}}</a></td><td>{{j['company']}}</td><td>{{j['part_name']}}</td><td>{{j['quantity']}}</td><td>{{j['req_type']}}</td><td>{{j['status']}}</td><td>{{j['created_at']}}</td></tr>{% else %}<tr><td colspan="7">No requests yet.</td></tr>{% endfor %}</table></div></body></html>
